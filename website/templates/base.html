<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Vertex{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='vertex_logo.png') }}">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{{ url_for('home') }}">
            <img src="{{ url_for('static', filename='vertex_logo.png') }}" alt="Vertex logo" class="brand-logo">
            <span>Vertex</span>
        </a>
        <nav>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('download') }}">Download</a>
            <a href="{{ url_for('features') }}">Features</a>
            <a href="{{ url_for('how_its_built') }}">How It's Built</a>
            <a href="{{ url_for('credits') }}">Credits</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p>Vertex is a self-hosted platform - there is no central "Vertex" server, only the one you or a friend runs.</p>
    </footer>
</body>
</html>
